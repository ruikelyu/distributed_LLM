claim_boundaries:
  - results_describe_two_registered_provincial_spatial_allocations_not_observed_facility_siting
  - top7_share_is_registered_spatial_allocation_not_physical_site_concentration
  - stress_composition_is_the_share_of_allocated_site_water_in_province_categories_not_a_scarcity_weighted_impact
  - site_water_quantity_and_stress_score_are_never_multiplied
  - PF_and_LDC_national_water_totals_use_different_registered_WUE_scenarios_and_their_difference_is_not_an_architecture_effect
  - cross_architecture_distribution_differences_are_descriptive_input_based_differences_not_causal_architecture_effects
  - Aqueduct40_baseline_is_a_1979_2019_prioritization_screen_not_real_time_or_site_validated_stress
  - industrial_gross_withdrawal_is_a_within_province_aggregation_weight_not_a_data_center_water_inventory
  - no_m3_world_equivalent_formal_LCIA_or_local_water_impact_is_reported
  - LDC_AGGREGATE_is_a_logical_equal_service_portfolio_not_one_physical_site
  - 2030_BAU_water_stress_is_excluded_and_reserved_for_RQ3_sensitivity
  - author_approved_wording_is_reserved_for_later_coordinated_manuscript_migration

automatic_manuscript_edit: false
