schema_version: 1
analysis_version: rq1_spatial_water_interpretation_v1
status: active_author_approved_interpretation_generator
defaults_config: config/defaults.yaml
figure5_config: config/scenarios/figure5_rq1_spatial_water_v1.yaml
required_figure_status: validated_approved_design_RQ1_spatial_water_figure
evidence_status: outputs_validated_interpretation_author_approved

validation:
  expected_architectures: [PF, LDC_AGGREGATE]
  expected_provinces: 31
  expected_rows: 62
  share_tolerance: 1.0e-10
  water_tolerance_m3_per_year: 1.0e-6
  required_context_flag: true
  required_automatic_manuscript_edit: false
  require_score_volume_product_missing: true
  required_stress_categories:
    0: Low (<10%)
    1: Low - Medium (10-20%)
    2: Medium - High (20-40%)
    3: High (40-80%)
    4: Extremely High (>80%)

summary:
  top_n: 7
  high_or_extremely_high_categories: [3, 4]
  architecture_labels:
    PF: PF
    LDC_AGGREGATE: LDC aggregate
